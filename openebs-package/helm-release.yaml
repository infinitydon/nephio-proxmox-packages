apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  releaseName: openebs
  chart:
    spec:
      chart: openebs
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
      version: "3.9.0"
  interval: 5m
  install:
    createNamespace: true
  values:
    localprovisioner:
      hostpathClass:
        enabled: true
        isDefaultClass: true
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openebs
  namespace: flux-system
spec:
  url: https://openebs.github.io/charts
  interval: 5m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: flux-system
spec:
  releaseName: openebs
  chart:
    spec:
      chart: openebs-internal/openebs
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
      version: "3.9.0"
  interval: 5m
  install:
    createNamespace: true
  values:
    localprovisioner:
      hostpathClass:
        enabled: true
        isDefaultClass: true  
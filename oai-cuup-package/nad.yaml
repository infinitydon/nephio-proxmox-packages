apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: cuup-edge-n3
  namespace: example
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "cuup-edge-n3",
      "plugins": [
        {
          "type": "macvlan",
          "capabilities": {
            "ips": true
          },
          "master": "CUUP_N3_MULTUSPARENTINTERFACE",
          "mode": "bridge",
          "ipam": {
            "type": "static"
          }
        }
      ]
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: cuup-edge-f1u
  namespace: example
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "cuup-edge-f1u",
      "plugins": [
        {
          "type": "macvlan",
          "capabilities": {
            "ips": true
          },
          "master": "CUUP_F1U_MULTUSPARENTINTERFACE",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "routes": [{ "dst": "CUCP_F1C_NETWORKADDRESS", "gw": "CUUP_F1U_GW" }]
          }
        }
      ]
    }
---

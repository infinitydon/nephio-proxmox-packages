apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: du-edge-f1
  namespace: example
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "du-edge-f1",
      "plugins": [
        {
          "type": "macvlan",
          "capabilities": {
            "ips": true
          },
          "master": "DU_F1U_MULTUSPARENTINTERFACE",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "routes": [{ "dst": "CUCP_F1C_NETWORKADDRESS", "gw": "DU_F1U_GW" }]
          }
        }
      ]
    }            